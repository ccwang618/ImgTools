<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImgTools</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #647083;
      --line: #d9e0ea;
      --brand: #0f766e;
      --brand-dark: #115e59;
      --accent: #b45309;
      --shadow: 0 14px 34px rgba(23, 32, 42, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .tool {
      display: flex;
      min-height: 180px;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .tool:hover,
    .tool:focus-visible {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--brand), var(--line) 35%);
      box-shadow: 0 18px 42px rgba(23, 32, 42, 0.14);
      outline: none;
    }

    .tool h2 {
      margin: 0 0 10px;
      font-size: 1.25rem;
      line-height: 1.35;
    }

    .tool p {
      font-size: 0.95rem;
    }

    .action {
      display: inline-flex;
      width: fit-content;
      margin-top: 22px;
      align-items: center;
      gap: 8px;
      color: var(--brand-dark);
      font-weight: 700;
    }

    .accent {
      color: var(--accent);
    }

    @media (max-width: 760px) {
      main {
        padding: 36px 0;
      }

      .tools {
        grid-template-columns: 1fr;
      }

      .tool {
        min-height: 150px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ImgTools</h1>
      <p>常用圖片與影像處理工具入口，直接在瀏覽器中開啟使用，也可部署到 GitHub Pages。</p>
    </header>

    <section class="tools" aria-label="工具列表">
      <a class="tool" href="add_mosaic.html">
        <span>
          <h2>圖片馬賽克工具</h2>
          <p>局部遮蔽圖片內容，適合處理截圖、照片與教學素材。</p>
        </span>
        <span class="action">開啟工具 <span aria-hidden="true">→</span></span>
      </a>

      <a class="tool" href="add_watermark.html">
        <span>
          <h2>圖片浮水印工具</h2>
          <p>為圖片加入文字浮水印，方便標示來源、用途或版本。</p>
        </span>
        <span class="action">開啟工具 <span aria-hidden="true">→</span></span>
      </a>

      <a class="tool" href="modify_img.html">
        <span>
          <h2>圖片編輯調整工具</h2>
          <p>本機調整圖片尺寸、旋轉方向與裁切範圍，支援常見影像格式。</p>
        </span>
        <span class="action">開啟工具 <span aria-hidden="true">→</span></span>
      </a>

      <a class="tool" href="webcam_barcode_qrcode.html">
        <span>
          <h2>Webcam 條碼／QR Code 工具</h2>
          <p>使用攝影機掃描條碼或 QR Code，適合快速讀取與測試。</p>
        </span>
        <span class="action accent">開啟工具 <span aria-hidden="true">→</span></span>
      </a>
    </section>
  </main>
</body>
</html>
