<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>圖片浮水印工具</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #627083;
      --line: #d7dee8;
      --brand: #0f766e;
      --brand-dark: #115e59;
      --accent: #a85516;
      --danger: #b42318;
      --ok: #16794c;
      --shadow: 0 14px 34px rgba(23, 32, 42, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    .app {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 34px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 7px;
      font-size: clamp(1.55rem, 2.5vw, 2.1rem);
      line-height: 1.2;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      min-height: 40px;
      padding: 9px 14px;
      background: #eef3f6;
      color: var(--ink);
      border: 1px solid #c9d4df;
    }

    .btn:hover {
      background: #e3ebf0;
    }

    .btn.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #ffffff;
    }

    .btn.primary:hover {
      background: var(--brand-dark);
    }

    .btn.ghost {
      background: transparent;
      border-color: var(--line);
    }

    .layout {
      display: grid;
      grid-template-columns: 350px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel h2 {
      margin: 0;
      padding: 15px 16px;
      font-size: 1rem;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }

    .section {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .section:last-child {
      border-bottom: 0;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label,
    .label {
      font-size: 0.92rem;
      font-weight: 700;
      color: #2d3748;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      min-height: 40px;
      padding: 9px 10px;
      border: 1px solid #c9d4df;
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      outline: none;
    }

    textarea {
      min-height: 78px;
      resize: vertical;
      line-height: 1.5;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }

    input[type="color"] {
      width: 100%;
      height: 42px;
      padding: 4px;
      border: 1px solid #c9d4df;
      border-radius: 6px;
      background: #ffffff;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--brand);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      background: #edf2f5;
      border: 1px solid #d3dce6;
      border-radius: 8px;
    }

    .segmented button {
      min-height: 38px;
      background: transparent;
      color: #314155;
      border: 1px solid transparent;
    }

    .segmented button.active {
      background: #ffffff;
      border-color: #bfd0dc;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
      color: var(--brand-dark);
      font-weight: 800;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .status {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .status strong {
      color: var(--ink);
    }

    .file-list {
      max-height: 178px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      border-bottom: 1px solid #eef2f6;
      font-size: 0.86rem;
      color: #354155;
    }

    .file-item:last-child {
      border-bottom: 0;
    }

    .file-item span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-area {
      min-height: 590px;
      display: grid;
      grid-template-rows: auto minmax(360px, 1fr) auto;
    }

    .preview-head,
    .preview-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 16px;
      background: #fbfcfd;
    }

    .preview-head {
      border-bottom: 1px solid var(--line);
    }

    .preview-foot {
      border-top: 1px solid var(--line);
    }

    .preview-title {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .preview-title strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-stage {
      display: grid;
      place-items: center;
      min-height: 360px;
      padding: 18px;
      overflow: auto;
      background:
        linear-gradient(45deg, #e7edf3 25%, transparent 25%),
        linear-gradient(-45deg, #e7edf3 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e7edf3 75%),
        linear-gradient(-45deg, transparent 75%, #e7edf3 75%);
      background-color: #f8fafc;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-size: 20px 20px;
    }

    canvas {
      max-width: 100%;
      max-height: 72vh;
      width: auto;
      height: auto;
      background: #ffffff;
      border: 1px solid #c8d3df;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
    }

    .empty {
      width: min(520px, 100%);
      padding: 34px 24px;
      text-align: center;
      color: var(--muted);
      line-height: 1.7;
      border: 2px dashed #bfccd9;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 9px;
      border-radius: 999px;
      background: #e8f4ee;
      color: var(--ok);
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .warning {
      color: var(--danger);
      background: #fff1f0;
    }

    progress {
      width: 100%;
      height: 12px;
      accent-color: var(--ok);
    }

    .progress-wrap {
      flex: 1;
      display: grid;
      gap: 6px;
    }

    .log {
      max-height: 116px;
      overflow: auto;
      margin-top: 10px;
      padding: 10px;
      background: #17202a;
      color: #dce7f5;
      border-radius: 6px;
      font: 12px/1.55 Consolas, "Courier New", monospace;
      white-space: pre-wrap;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 900px) {
      .topbar,
      .preview-foot {
        display: grid;
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .toolbar {
        justify-content: stretch;
      }

      .toolbar .btn {
        flex: 1 1 160px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .preview-area {
        min-height: 460px;
      }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100% - 20px, 1180px);
        padding-top: 18px;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .toolbar,
      .preview-head {
        flex-direction: column;
        align-items: stretch;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>圖片浮水印工具</h1>
        <p class="subtitle">批次加入文字浮水印，支援 PNG、JPG 與 WebP。所有圖片都只在瀏覽器中處理，可直接放在 GitHub Pages 使用。</p>
      </div>
      <div class="toolbar">
        <button class="btn" id="pickFilesBtn" type="button">載入圖片</button>
        <button class="btn" id="pickFolderBtn" type="button">載入資料夾</button>
        <button class="btn primary" id="runBtn" type="button" disabled>開始輸出</button>
      </div>
    </header>

    <div class="layout">
      <aside class="panel" aria-label="浮水印設定">
        <h2>輸入設定</h2>
        <section class="section">
          <div class="field">
            <span class="label">圖片格式</span>
            <select id="inputType">
              <option value="image/*">全部圖片</option>
              <option value="image/png">PNG</option>
              <option value="image/jpeg">JPG / JPEG</option>
              <option value="image/webp">WebP</option>
            </select>
          </div>
          <input class="hidden" id="fileInput" type="file" accept="image/*" multiple>
          <input class="hidden" id="folderInput" type="file" accept="image/*" webkitdirectory multiple>
          <div class="status">
            <div>已選擇 <strong id="fileCount">0</strong> 張圖片</div>
            <div id="inputSource">尚未載入圖片。</div>
          </div>
          <div class="file-list hidden" id="fileList"></div>
        </section>

        <section class="section">
          <div class="field">
            <span class="label">輸出方式</span>
            <div class="segmented" role="group" aria-label="輸出方式">
              <button id="downloadMode" class="active" type="button">逐張下載</button>
              <button id="outputFolderMode" type="button">輸出資料夾</button>
            </div>
          </div>
          <p class="hint">GitHub Pages 上建議使用「逐張下載」。若瀏覽器支援資料夾寫入，也可以改用「輸出資料夾」。</p>
          <div class="field hidden" id="outputFolderField">
            <button class="btn" id="pickOutputBtn" type="button">選擇輸出資料夾</button>
            <div class="hint" id="outputHint">尚未選擇輸出資料夾。</div>
          </div>
          <div class="row">
            <div class="field">
              <label for="outputType">輸出格式</label>
              <select id="outputType">
                <option value="image/png">PNG</option>
                <option value="image/jpeg">JPG</option>
                <option value="image/webp">WebP</option>
              </select>
            </div>
            <div class="field">
              <label for="quality">JPG / WebP 品質</label>
              <input id="quality" type="number" min="1" max="100" value="92">
            </div>
          </div>
        </section>

        <h2>Watermark 設定</h2>
        <section class="section">
          <div class="field">
            <label for="watermarkText">浮水印文字</label>
            <textarea id="watermarkText">CCWANG</textarea>
          </div>
          <div class="row">
            <div class="field">
              <label for="fontFamily">字型</label>
              <select id="fontFamily">
                <option value="'Microsoft JhengHei', sans-serif">微軟正黑體</option>
                <option value="'PMingLiU', serif">新細明體</option>
                <option value="Arial, sans-serif">Arial</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="'Courier New', monospace">Courier New</option>
              </select>
            </div>
            <div class="field">
              <label for="fontSize">字級，px</label>
              <input id="fontSize" type="number" min="8" max="360" value="54">
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label for="fontColor">顏色</label>
              <input id="fontColor" type="color" value="#ffffff">
            </div>
            <div class="field">
              <label for="opacity">透明度，%</label>
              <input id="opacity" type="number" min="1" max="100" value="34">
            </div>
          </div>
          <div class="field">
            <label for="gap">浮水印間距，<span id="gapValue">180</span> px</label>
            <input id="gap" type="range" min="20" max="700" value="180">
          </div>
          <div class="field">
            <label for="angle">旋轉角度，<span id="angleValue">-28</span> 度</label>
            <input id="angle" type="range" min="-80" max="80" value="-28">
          </div>
        </section>
      </aside>

      <section class="panel preview-area" aria-label="圖片預覽">
        <div class="preview-head">
          <div class="preview-title">
            <strong id="previewName">預覽</strong>
            <span class="hint" id="previewMeta">載入圖片後會顯示第一張的浮水印效果。</span>
          </div>
          <span class="pill" id="supportBadge">GitHub Pages 可用</span>
        </div>
        <div class="preview-stage">
          <div class="empty" id="emptyState">請先載入圖片或整個資料夾。</div>
          <canvas class="hidden" id="previewCanvas"></canvas>
        </div>
        <div class="preview-foot">
          <div class="progress-wrap">
            <progress id="progress" value="0" max="100"></progress>
            <span class="hint" id="progressText">尚未開始輸出。</span>
          </div>
          <button class="btn ghost" id="clearBtn" type="button">清除清單</button>
        </div>
      </section>
    </div>
    <div class="log hidden" id="log" aria-live="polite"></div>
  </main>

  <script>
    const state = {
      files: [],
      outputHandle: null,
      outputMode: "download",
      isProcessing: false
    };

    const el = {
      inputType: document.getElementById("inputType"),
      fileInput: document.getElementById("fileInput"),
      folderInput: document.getElementById("folderInput"),
      pickFilesBtn: document.getElementById("pickFilesBtn"),
      pickFolderBtn: document.getElementById("pickFolderBtn"),
      pickOutputBtn: document.getElementById("pickOutputBtn"),
      outputFolderMode: document.getElementById("outputFolderMode"),
      downloadMode: document.getElementById("downloadMode"),
      outputFolderField: document.getElementById("outputFolderField"),
      outputHint: document.getElementById("outputHint"),
      outputType: document.getElementById("outputType"),
      quality: document.getElementById("quality"),
      watermarkText: document.getElementById("watermarkText"),
      fontFamily: document.getElementById("fontFamily"),
      fontSize: document.getElementById("fontSize"),
      fontColor: document.getElementById("fontColor"),
      opacity: document.getElementById("opacity"),
      gap: document.getElementById("gap"),
      gapValue: document.getElementById("gapValue"),
      angle: document.getElementById("angle"),
      angleValue: document.getElementById("angleValue"),
      fileCount: document.getElementById("fileCount"),
      inputSource: document.getElementById("inputSource"),
      fileList: document.getElementById("fileList"),
      previewName: document.getElementById("previewName"),
      previewMeta: document.getElementById("previewMeta"),
      previewCanvas: document.getElementById("previewCanvas"),
      emptyState: document.getElementById("emptyState"),
      runBtn: document.getElementById("runBtn"),
      clearBtn: document.getElementById("clearBtn"),
      progress: document.getElementById("progress"),
      progressText: document.getElementById("progressText"),
      log: document.getElementById("log"),
      supportBadge: document.getElementById("supportBadge")
    };

    const outputExtensions = {
      "image/png": "png",
      "image/jpeg": "jpg",
      "image/webp": "webp"
    };

    initialize();

    function initialize() {
      bindEvents();
      updateAcceptType();
      updateSupportBadge();
      setOutputMode("download");
      updateControls();
      renderPreview();
    }

    function bindEvents() {
      el.pickFilesBtn.addEventListener("click", () => el.fileInput.click());
      el.pickFolderBtn.addEventListener("click", () => el.folderInput.click());
      el.fileInput.addEventListener("change", () => setFiles([...el.fileInput.files], "檔案"));
      el.folderInput.addEventListener("change", () => setFiles([...el.folderInput.files], "資料夾"));
      el.inputType.addEventListener("change", () => {
        updateAcceptType();
        filterSelectedFiles();
      });
      el.pickOutputBtn.addEventListener("click", pickOutputFolder);
      el.outputFolderMode.addEventListener("click", () => setOutputMode("folder"));
      el.downloadMode.addEventListener("click", () => setOutputMode("download"));
      el.runBtn.addEventListener("click", processImages);
      el.clearBtn.addEventListener("click", clearFiles);

      [
        el.outputType,
        el.quality,
        el.watermarkText,
        el.fontFamily,
        el.fontSize,
        el.fontColor,
        el.opacity,
        el.gap,
        el.angle
      ].forEach((control) => control.addEventListener("input", renderPreview));

      el.gap.addEventListener("input", () => {
        el.gapValue.textContent = el.gap.value;
      });
      el.angle.addEventListener("input", () => {
        el.angleValue.textContent = el.angle.value;
      });
    }

    function updateSupportBadge() {
      if (window.isSecureContext || location.protocol === "file:") {
        el.supportBadge.textContent = "GitHub Pages 可用";
        el.supportBadge.classList.remove("warning");
      } else {
        el.supportBadge.textContent = "建議改用 HTTPS 或 localhost";
        el.supportBadge.classList.add("warning");
      }
    }

    function updateAcceptType() {
      el.fileInput.accept = el.inputType.value;
      el.folderInput.accept = el.inputType.value;
    }

    function setFiles(files, sourceLabel) {
      const filtered = files.filter(isAcceptedImage);
      state.files = filtered.sort((a, b) => getDisplayName(a).localeCompare(getDisplayName(b), "zh-Hant"));
      el.inputSource.textContent = state.files.length
        ? `來源：${sourceLabel}，已排除不支援的檔案。`
        : "沒有符合格式的圖片。";
      renderFileList();
      updateControls();
      renderPreview();
    }

    function filterSelectedFiles() {
      if (!state.files.length) return;
      state.files = state.files.filter(isAcceptedImage);
      renderFileList();
      updateControls();
      renderPreview();
    }

    function isAcceptedImage(file) {
      if (!file.type.startsWith("image/")) return false;
      return el.inputType.value === "image/*" || file.type === el.inputType.value;
    }

    function renderFileList() {
      el.fileCount.textContent = state.files.length;
      el.fileList.innerHTML = "";
      el.fileList.classList.toggle("hidden", state.files.length === 0);

      state.files.slice(0, 80).forEach((file) => {
        const item = document.createElement("div");
        item.className = "file-item";
        item.innerHTML = `<span title="${escapeHtml(getDisplayName(file))}">${escapeHtml(getDisplayName(file))}</span><span>${formatBytes(file.size)}</span>`;
        el.fileList.appendChild(item);
      });

      if (state.files.length > 80) {
        const more = document.createElement("div");
        more.className = "file-item";
        more.textContent = `另有 ${state.files.length - 80} 張圖片未列出`;
        el.fileList.appendChild(more);
      }
    }

    function setOutputMode(mode) {
      const canUseFolder = Boolean(window.showDirectoryPicker);
      state.outputMode = mode === "folder" && canUseFolder ? "folder" : "download";

      if (mode === "folder" && !canUseFolder) {
        appendLog("這個瀏覽器不支援輸出資料夾，已改用逐張下載。");
      }

      el.outputFolderMode.classList.toggle("active", state.outputMode === "folder");
      el.downloadMode.classList.toggle("active", state.outputMode === "download");
      el.outputFolderField.classList.toggle("hidden", state.outputMode !== "folder");
      updateControls();
    }

    async function pickOutputFolder() {
      if (!window.showDirectoryPicker) {
        appendLog("這個瀏覽器不支援選擇輸出資料夾，請使用逐張下載。");
        setOutputMode("download");
        return;
      }

      try {
        state.outputHandle = await window.showDirectoryPicker({ mode: "readwrite" });
        el.outputHint.textContent = `輸出資料夾：${state.outputHandle.name}`;
      } catch (error) {
        if (error.name !== "AbortError") {
          appendLog(`選擇輸出資料夾失敗：${error.message}`);
        }
      }
      updateControls();
    }

    function updateControls() {
      const needsFolder = state.outputMode === "folder";
      const canRun = state.files.length > 0 && !state.isProcessing && (!needsFolder || state.outputHandle);
      el.runBtn.disabled = !canRun;
      el.runBtn.textContent = state.isProcessing ? "輸出中" : "開始輸出";
    }

    async function renderPreview() {
      el.gapValue.textContent = el.gap.value;
      el.angleValue.textContent = el.angle.value;

      if (!state.files.length) {
        el.previewCanvas.classList.add("hidden");
        el.emptyState.classList.remove("hidden");
        el.emptyState.textContent = "請先載入圖片或整個資料夾。";
        el.previewName.textContent = "預覽";
        el.previewMeta.textContent = "載入圖片後會顯示第一張的浮水印效果。";
        return;
      }

      try {
        const firstFile = state.files[0];
        const canvas = await renderWatermarkedCanvas(firstFile);
        const previewCanvas = el.previewCanvas;
        const ctx = previewCanvas.getContext("2d");
        previewCanvas.width = canvas.width;
        previewCanvas.height = canvas.height;
        ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        ctx.drawImage(canvas, 0, 0);
        el.previewCanvas.classList.remove("hidden");
        el.emptyState.classList.add("hidden");
        el.previewName.textContent = getDisplayName(firstFile);
        el.previewMeta.textContent = `${canvas.width} x ${canvas.height}，${formatBytes(firstFile.size)}`;
      } catch (error) {
        el.previewCanvas.classList.add("hidden");
        el.emptyState.classList.remove("hidden");
        el.emptyState.textContent = `預覽失敗：${error.message}`;
      }
    }

    async function processImages() {
      if (!state.files.length || state.isProcessing) return;

      state.isProcessing = true;
      updateControls();
      resetProgress();
      appendLog(`開始處理 ${state.files.length} 張圖片。`, true);

      let successCount = 0;
      for (let index = 0; index < state.files.length; index += 1) {
        const file = state.files[index];
        try {
          const canvas = await renderWatermarkedCanvas(file);
          const blob = await canvasToBlob(canvas, el.outputType.value, normalizedQuality());
          const outputName = buildOutputName(file, el.outputType.value);

          if (state.outputMode === "folder") {
            await writeBlobToFolder(outputName, blob);
          } else {
            downloadBlob(outputName, blob);
            await delay(220);
          }

          successCount += 1;
          appendLog(`完成：${outputName}`);
        } catch (error) {
          appendLog(`失敗：${getDisplayName(file)}，${error.message}`);
        }

        const percent = Math.round(((index + 1) / state.files.length) * 100);
        el.progress.value = percent;
        el.progressText.textContent = `進度 ${index + 1} / ${state.files.length}`;
      }

      appendLog(`處理完成：成功 ${successCount} 張，失敗 ${state.files.length - successCount} 張。`);
      state.isProcessing = false;
      updateControls();
    }

    async function renderWatermarkedCanvas(file) {
      const image = await loadImage(file);
      const canvas = document.createElement("canvas");
      canvas.width = image.naturalWidth || image.width;
      canvas.height = image.naturalHeight || image.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(image, 0, 0);
      drawWatermark(ctx, canvas.width, canvas.height);
      return canvas;
    }

    function drawWatermark(ctx, width, height) {
      const text = el.watermarkText.value.trim() || "Watermark";
      const fontSize = clamp(Number(el.fontSize.value), 8, 360);
      const gap = clamp(Number(el.gap.value), 20, 700);
      const angle = clamp(Number(el.angle.value), -80, 80) * Math.PI / 180;
      const opacity = clamp(Number(el.opacity.value), 1, 100) / 100;
      const diagonal = Math.sqrt(width * width + height * height);
      const stepY = Math.max(gap, fontSize * 2);

      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.rotate(angle);
      ctx.globalAlpha = opacity;
      ctx.fillStyle = el.fontColor.value;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `700 ${fontSize}px ${el.fontFamily.value}`;

      const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      const lineHeight = fontSize * 1.25;
      const maxTextWidth = Math.max(...lines.map((line) => ctx.measureText(line).width), fontSize);
      const stepX = Math.max(maxTextWidth + gap, fontSize * 2);

      for (let y = -diagonal; y <= diagonal; y += stepY) {
        for (let x = -diagonal; x <= diagonal; x += stepX) {
          const startY = y - ((lines.length - 1) * lineHeight) / 2;
          lines.forEach((line, lineIndex) => {
            ctx.fillText(line, x, startY + lineIndex * lineHeight);
          });
        }
      }

      ctx.restore();
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("圖片讀取失敗。"));
        };
        image.src = url;
      });
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error("圖片輸出失敗。"));
          }
        }, type, quality);
      });
    }

    async function writeBlobToFolder(fileName, blob) {
      const fileHandle = await state.outputHandle.getFileHandle(fileName, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
    }

    function downloadBlob(fileName, blob) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1200);
    }

    function buildOutputName(file, mimeType) {
      const displayName = getDisplayName(file).split(/[\\/]/).pop() || file.name;
      const baseName = displayName.replace(/\.[^.]+$/, "");
      return `${baseName}_watermark.${outputExtensions[mimeType] || "png"}`;
    }

    function getDisplayName(file) {
      return file.webkitRelativePath || file.name;
    }

    function normalizedQuality() {
      return clamp(Number(el.quality.value), 1, 100) / 100;
    }

    function resetProgress() {
      el.progress.value = 0;
      el.progressText.textContent = "準備輸出。";
    }

    function clearFiles() {
      state.files = [];
      state.outputHandle = null;
      el.fileInput.value = "";
      el.folderInput.value = "";
      el.inputSource.textContent = "尚未載入圖片。";
      el.outputHint.textContent = "尚未選擇輸出資料夾。";
      renderFileList();
      resetProgress();
      updateControls();
      renderPreview();
    }

    function appendLog(message, clear = false) {
      if (clear) {
        el.log.textContent = "";
      }
      el.log.classList.remove("hidden");
      const time = new Date().toLocaleTimeString("zh-TW", { hour12: false });
      el.log.textContent += `[${time}] ${message}\n`;
      el.log.scrollTop = el.log.scrollHeight;
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    function clamp(value, min, max) {
      if (Number.isNaN(value)) return min;
      return Math.min(max, Math.max(min, value));
    }

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
